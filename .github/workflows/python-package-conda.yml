name: Python validation

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Compile Python modules
      run: |
        python -m compileall backend crawler storage monitoring
    - name: Test read-only API
      run: |
        python -m pytest backend/tests -q
    - name: Test storage and monitoring
      run: |
        python -m storage.test_tracker
        python -m monitoring.test_monitoring
